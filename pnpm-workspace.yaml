allowBuilds:
  '@parcel/watcher': true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - mongoose@9.10.4
# Force transitive deps to patched versions (DoS advisories). These are pulled
# in by eslint/jest/next tooling that hasn't bumped them upstream yet.
overrides:
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
